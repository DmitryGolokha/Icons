<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Мега-Ком — Премиум анимация</title>
    <style>
        :root { color-scheme: light; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff !important; /* Чисто белый фон */
            margin: 0;
            overflow: hidden;
        }

        /* Контейнер обрезает блик, чтобы он не выходил за пределы картинки */
        .logo-container {
            position: relative;
            width: 400px; /* Ширина логотипа. Подстройте под свой размер */
            overflow: hidden;
            /* Анимация появления (всплытие с размытием) */
            animation: revealLogo 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            
            /* Непрерывная пульсация после появления */
            animation: revealLogo 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                       pulseLogo 3s ease-in-out 1.5s infinite;
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            filter: blur(10px);
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* СОЗДАЕМ БЛИК (эффект стекла) */
        .logo-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.8) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            /* Блик запускается с задержкой, когда логотип уже появился */
            animation: shine 4s infinite 1.5s; 
        }

        /* Анимация появления */
        @keyframes revealLogo {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        /* Легкая пульсация */
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Анимация пробегающего блика */
        @keyframes shine {
            0% { left: -150%; }
            20% { left: 150%; } /* Блик быстро пробегает */
            100% { left: 150%; } /* Пауза перед следующим */
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- ВСТАВЬТЕ ССЫЛКУ НА ВАШУ ОРИГИНАЛЬНУЮ КАРТИНКУ ЛОГОТИПА -->
        <img src="logo.png" alt="Мега-Ком">
    </div>

</body>
</html>
