<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Мега-Ком — Сборка логотипа</title>
    <!-- Подключаем округлый шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { color-scheme: light; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff !important;
            margin: 0;
            font-family: 'Comfortaa', cursive;
            overflow: hidden;
        }

        /* Контейнер для логотипа */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-container:hover {
            transform: scale(1.05);
        }

        /* --- ВЕКТОРНАЯ ИКОНКА (SVG) --- */
        .logo-icon {
            width: 80px;
            height: 50px;
            opacity: 0;
            animation: slideInLeft 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* --- ТЕКСТ --- */
        .logo-text {
            display: flex;
            font-size: 42px;
            color: #333333;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1;
        }

        .logo-text span {
            display: inline-block;
            opacity: 0; /* Изначально буквы невидимы */
            /* Применяем анимацию сборки */
            animation: assemble 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Красный дефис */
        .logo-text .dash {
            color: #cc0000;
        }

        /* Настраиваем, откуда и с какой задержкой вылетает каждая буква */
        .logo-text span:nth-child(1) { animation-delay: 0.2s; --start-x: -50px; --start-y: -50px; --start-r: -45deg; } /* М */
        .logo-text span:nth-child(2) { animation-delay: 0.3s; --start-x: 30px; --start-y: -80px; --start-r: 30deg; }   /* е */
        .logo-text span:nth-child(3) { animation-delay: 0.4s; --start-x: -30px; --start-y: 80px; --start-r: -20deg; }   /* г */
        .logo-text span:nth-child(4) { animation-delay: 0.5s; --start-x: 40px; --start-y: 50px; --start-r: 45deg; }     /* а */
        .logo-text span:nth-child(5) { animation-delay: 0.6s; --start-x: 0px; --start-y: -100px; --start-r: 0deg; }     /* - */
        .logo-text span:nth-child(6) { animation-delay: 0.7s; --start-x: 80px; --start-y: 30px; --start-r: 60deg; }     /* К */
        .logo-text span:nth-child(7) { animation-delay: 0.8s; --start-x: -50px; --start-y: -40px; --start-r: -30deg; }  /* о */
        .logo-text span:nth-child(8) { animation-delay: 0.9s; --start-x: 50px; --start-y: 80px; --start-r: 20deg; }     /* м */

        /* Анимация вылета и сборки */
        @keyframes assemble {
            0% {
                opacity: 0;
                transform: translate(var(--start-x), var(--start-y)) rotate(var(--start-r)) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translate(0, 0) rotate(0) scale(1);
            }
        }

        /* Анимация выезда иконки */
        @keyframes slideInLeft {
            0% {
                opacity: 0;
                transform: translateX(-50px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        /* Небольшая пульсация после сборки (запустится с задержкой) */
        .logo-container {
            animation: pulseLogo 4s ease-in-out 2s infinite;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        
        <!-- Иконка "МК" (нарисована в SVG) -->
        <svg class="logo-icon" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
            <!-- Черные полоски (М) -->
            <polygon points="5,45 20,5 30,5 15,45" fill="#333333"/>
            <polygon points="20,45 35,5 45,5 30,45" fill="#333333"/>
            <!-- Красная полоска (К) -->
            <polygon points="45,45 45,20 55,20 55,45" fill="#cc0000"/>
            <polygon points="45,30 65,5 80,5 55,30" fill="#cc0000"/>
        </svg>

        <!-- Текст "Мега-Ком", разбитый по буквам -->
        <div class="logo-text">
            <span>М</span>
            <span>е</span>
            <span>г</span>
            <span>а</span>
            <span class="dash">-</span>
            <span>К</span>
            <span>о</span>
            <span>м</span>
        </div>
        
    </div>

</body>
</html>
