<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Мега-Ком — Анимация Текста</title>
    <!-- Подключаем округлый шрифт, похожий на оригинальный -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { color-scheme: light; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff !important; /* Белый фон */
            margin: 0;
            font-family: 'Comfortaa', cursive; /* Применяем шрифт */
        }

        /* Контейнер для всего логотипа */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px; /* Расстояние между иконкой и текстом */
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        /* При наведении на весь логотип он чуть увеличивается */
        .logo-container:hover {
            transform: scale(1.05);
        }

        /* --- РИСУЕМ ИКОНКУ ЧЕРЕЗ CSS --- */
        .logo-icon {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        
        .logo-icon span {
            display: block;
            height: 40px;
            width: 14px;
            transform: skewX(-25deg); /* Наклоняем полоски */
            border-radius: 2px;
        }
        
        .logo-icon span:nth-child(1) { background-color: #333333; }
        .logo-icon span:nth-child(2) { background-color: #333333; }
        /* Красная галочка/буква K */
        .logo-icon span:nth-child(3) { 
            background-color: #cc0000; 
            height: 20px;
            margin-top: 20px; /* Сдвигаем вниз, имитируя форму */
            width: 20px;
            transform: skewX(-25deg) rotate(45deg);
        }

        /* --- СТИЛИ ДЛЯ ТЕКСТА --- */
        .logo-text {
            display: flex;
            font-size: 42px;
            color: #333333;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1;
        }

        .logo-text span {
            display: inline-block;
            /* Применяем бесконечную анимацию волны */
            animation: wave 2.5s ease-in-out infinite;
        }

        /* Красный дефис */
        .logo-text .dash {
            color: #cc0000;
        }

        /* Задержка для каждой буквы (создает эффект волны) */
        .logo-text span:nth-child(1) { animation-delay: 0.0s; }
        .logo-text span:nth-child(2) { animation-delay: 0.1s; }
        .logo-text span:nth-child(3) { animation-delay: 0.2s; }
        .logo-text span:nth-child(4) { animation-delay: 0.3s; }
        .logo-text span:nth-child(5) { animation-delay: 0.4s; }
        .logo-text span:nth-child(6) { animation-delay: 0.5s; }
        .logo-text span:nth-child(7) { animation-delay: 0.6s; }
        .logo-text span:nth-child(8) { animation-delay: 0.7s; }
        .logo-text span:nth-child(9) { animation-delay: 0.8s; }

        /* Сама анимация "волны" (буквы плавно подпрыгивают) */
        @keyframes wave {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px); /* Высота подпрыгивания */
            }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Иконка -->
        <div class="logo-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Текст, разбитый по буквам -->
        <div class="logo-text">
            <span>M</span>
            <span>e</span>
            <span>г</span>
            <span>a</span>
            <span class="dash">-</span>
            <span>K</span>
            <span>o</span>
            <span>м</span>
        </div>
    </div>

</body>
</html>
