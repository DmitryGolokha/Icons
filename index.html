<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Мега-Ком — Сканирование</title>
    
    <style>
        /* --- ПОДКЛЮЧАЕМ ВАШ ШРИФТ --- */
        @font-face {
            font-family: 'Averta Cyrillic';
            src: url('Averta Cyrillic Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root { color-scheme: light; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f5f7 !important;
            margin: 0;
            overflow: hidden;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 20px;
            /* Пульсация запускается после блика */
            animation: pulseFinal 4s ease-in-out 7s infinite;
        }

        /* --- ИКОНКА (ВЫЕЗЖАЕТ СЛЕВА) --- */
        .icon-wrapper {
            position: relative;
            height: 65px;
            display: flex;
            align-items: center;
        }

        .logo-icon {
            height: 65px; 
            width: auto;
            opacity: 0;
            /* Анимация выезда слева */
            animation: slideInLeft 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Блик для иконки */
        .icon-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.8) 50%, transparent 100%);
            background-size: 60px 100%;
            background-repeat: no-repeat;
            background-position: -60px 0; 
            
            -webkit-mask-image: url('icon.png');
            mask-image: url('icon.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            
            animation: scanEffect 3.5s linear infinite 2.5s;
            opacity: 0;
            pointer-events: none;
        }

        /* --- ТЕКСТ (ВЫЕЗЖАЕТ СПРАВА) --- */
        .logo-text {
            display: flex;
            font-size: 48px; 
            color: #222222;  
            font-family: 'Averta Cyrillic', sans-serif; 
            font-weight: bold;
            line-height: 1;
            letter-spacing: -0.5px; 
            position: relative; 
        }

        .logo-text span {
            display: inline-block;
            opacity: 0;
            /* Анимация выезда справа для букв */
            animation: slideInRight 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Задержки букв для эффекта "волны" при выезде */
        .logo-text span:nth-child(1) { animation-delay: 0.1s; }
        .logo-text span:nth-child(2) { animation-delay: 0.2s; }
        .logo-text span:nth-child(3) { animation-delay: 0.3s; }
        .logo-text span:nth-child(4) { animation-delay: 0.4s; }
        .logo-text span:nth-child(5) { animation-delay: 0.5s; }
        .logo-text span:nth-child(6) { animation-delay: 0.6s; }
        .logo-text span:nth-child(7) { animation-delay: 0.7s; }
        .logo-text span:nth-child(8) { animation-delay: 0.8s; }

        /* Блик для текста */
        .logo-text::after {
            content: 'Мега-Ком';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            font-family: 'Averta Cyrillic', sans-serif;
            font-size: 48px;
            font-weight: bold;
            letter-spacing: -0.5px;
            line-height: 1;
            white-space: nowrap;
            
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.9) 50%, transparent 100%);
            background-size: 60px 100%;
            background-repeat: no-repeat;
            background-position: -60px 0;
            
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            
            animation: scanEffect 3.5s linear infinite 2.5s;
            opacity: 0;
            pointer-events: none;
        }

        /* --- АНИМАЦИИ --- */
        
        /* Появление иконки слева */
        @keyframes slideInLeft {
            0% { opacity: 0; transform: translateX(-100px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        /* Появление букв справа */
        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(100px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulseFinal {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Движение блика */
        @keyframes scanEffect {
            0%   { background-position: -60px 0; opacity: 0; }
            10%  { opacity: 1; } 
            90%  { opacity: 1; } 
            100% { background-position: calc(100% + 60px) 0; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        
        <div class="icon-wrapper">
            <img src="icon.png" class="logo-icon" alt="Mega-Kom Icon">
        </div>

        <div class="logo-text">
            <span>М</span>
            <span>е</span>
            <span>г</span>
            <span>а</span>
            <span>-</span>
            <span>К</span>
            <span>о</span>
            <span>м</span>
        </div>
        
    </div>

</body>
</html>
