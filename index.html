<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Мега-Ком — Сборка логотипа</title>
    <!-- Подключаем строгий, современный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    
    <style>
        :root { color-scheme: light; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff !important;
            margin: 0;
            font-family: 'Montserrat', sans-serif; /* Строгий шрифт */
            overflow: hidden;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px; /* Расстояние между иконкой и текстом */
        }

        /* --- ИКОНКА (Улучшенный SVG) --- */
        .logo-icon {
            width: 60px;
            height: 45px;
            opacity: 0;
            animation: slideIn 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* --- ТЕКСТ --- */
        .logo-text {
            display: flex;
            font-size: 38px; /* Размер текста */
            color: #222222;
            font-weight: 800; /* Жирный */
            letter-spacing: 1px;
            line-height: 1;
        }

        .logo-text span {
            display: inline-block;
            opacity: 0; 
            animation: assemble 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .logo-text .dash {
            color: #d10000; /* Ярко-красный */
        }

        /* Настраиваем вылет для каждой буквы */
        .logo-text span:nth-child(1) { animation-delay: 0.2s; --x: -40px; --y: -40px; }
        .logo-text span:nth-child(2) { animation-delay: 0.3s; --x: 20px; --y: -60px; }
        .logo-text span:nth-child(3) { animation-delay: 0.4s; --x: -20px; --y: 60px; }
        .logo-text span:nth-child(4) { animation-delay: 0.5s; --x: 30px; --y: 40px; }
        .logo-text span:nth-child(5) { animation-delay: 0.6s; --x: 0px; --y: -80px; }
        .logo-text span:nth-child(6) { animation-delay: 0.7s; --x: 60px; --y: 20px; }
        .logo-text span:nth-child(7) { animation-delay: 0.8s; --x: -40px; --y: -30px; }
        .logo-text span:nth-child(8) { animation-delay: 0.9s; --x: 40px; --y: 60px; }

        /* Анимации */
        @keyframes assemble {
            0% {
                opacity: 0;
                transform: translate(var(--x), var(--y)) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
        }

        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(-30px) scale(0.8); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }

        /* Легкая пульсация после сборки */
        .logo-container {
            animation: pulse 4s ease-in-out 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        
        <!-- Иконка "МК" (Максимально приближенная к оригиналу) -->
        <svg class="logo-icon" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
            <!-- Черная полоса 1 (левая) -->
            <path d="M10,60 L25,10 L35,10 L20,60 Z" fill="#222222" />
            <!-- Черная полоса 2 (правая) с "вырезом" внизу -->
            <path d="M30,60 L45,10 L55,10 L45,35 L35,35 L30,60 Z" fill="#222222" />
            <!-- Красная "К" -->
            <path d="M45,60 L55,25 L70,10 L85,10 L60,35 L80,60 L65,60 L50,40 L45,60 Z" fill="#d10000" />
        </svg>

        <!-- Текст "Мега-Ком" -->
        <div class="logo-text">
            <span>М</span>
            <span>е</span>
            <span>г</span>
            <span>а</span>
            <span class="dash">-</span>
            <span>К</span>
            <span>о</span>
            <span>м</span>
        </div>
        
    </div>

</body>
</html>
