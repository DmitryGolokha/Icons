<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Mega-Kom — Tech Reveal</title>
    <style>
        :root { color-scheme: light; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa !important;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Контейнер для логотипа */
        .logo-scene {
            position: relative;
            /* Размеры контейнера подгоняем под логотип */
            width: 600px; 
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Сам логотип (картинка) */
        .logo-image {
            width: 100%;
            height: auto;
            object-fit: contain;
            /* Изначально логотип невидим, затемняется и немного размыт */
            opacity: 0;
            filter: blur(10px) grayscale(100%) brightness(2);
            transform: scale(0.95);
            
            /* Запускаем анимацию проявления */
            animation: 
                revealLogo 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                floatLogo 4s ease-in-out 1.5s infinite;
        }

        /* Эффект сканирующей линии */
        .scanner {
            position: absolute;
            top: -10%;
            left: 0;
            width: 2px;
            height: 120%;
            background: #d10000; /* Красный цвет, как в лого */
            box-shadow: 0 0 15px 5px rgba(209, 0, 0, 0.5);
            opacity: 0;
            z-index: 2;
            /* Анимация прохода линии слева направо */
            animation: scan 1.5s ease-in-out 0.2s forwards;
        }

        /* Блик поверх логотипа */
        .shine {
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.7) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            z-index: 3;
            /* Блик запускается после того, как лого проявился */
            animation: shine 1s ease-in-out 1.8s forwards;
            pointer-events: none;
        }

        /* Подсветка (свечение) позади логотипа */
        .glow {
            position: absolute;
            width: 200px;
            height: 100px;
            background: radial-gradient(circle, rgba(209,0,0,0.15) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
            opacity: 0;
            transform: scale(0.5);
            animation: glowUp 2s ease-out 1.5s forwards;
        }

        /* --- АНИМАЦИИ --- */

        /* Проявление логотипа из размытия */
        @keyframes revealLogo {
            0% {
                opacity: 0;
                filter: blur(15px) grayscale(100%) brightness(2);
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                filter: blur(0) grayscale(0) brightness(1);
                transform: scale(1);
            }
        }

        /* Проход сканирующей линии */
        @keyframes scan {
            0% { left: 0; opacity: 1; }
            90% { left: 100%; opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        /* Блик */
        @keyframes shine {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        /* Легкое парение логотипа (чтобы он не был статичным) */
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Появление свечения позади */
        @keyframes glowUp {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1.5); }
        }
    </style>
</head>
<body>

    <div class="logo-scene">
        <!-- Свечение позади -->
        <div class="glow"></div>
        
        <!-- ВАЖНО: Замените ссылку ниже на путь к вашему горизонтальному логотипу -->
        <img src="logo.svg" alt="Mega-Kom" class="logo-image">
        
        <!-- Сканер и блик -->
        <div class="scanner"></div>
        <div class="shine"></div>
    </div>

</body>
</html>
